name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test-classes: ${{ steps.discover.outputs.test-classes }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Discover test classes
      id: discover
      run: |
        # Find all public classes in test files
        # 1. Extract "public class ClassName" declarations
        # 2. Extract just the class name (remove everything after class name)
        # 3. Exclude base classes, fixtures, collections, and helpers
        # 4. Convert to JSON array for matrix
        classes=$(grep -rh "public class " tests/Asynkron.JsEngine.Tests/*.cs \
          | sed 's/.*public class //' \
          | cut -d' ' -f1 \
          | cut -d'(' -f1 \
          | cut -d':' -f1 \
          | cut -d'<' -f1 \
          | grep -v "Base$\|Fixture$\|Collection$\|Helper$" \
          | sort -u \
          | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "test-classes=$classes" >> $GITHUB_OUTPUT
        echo "Discovered $(echo $classes | jq '. | length') test classes"

  test:
    needs: discover-tests
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        test-class: ${{ fromJson(needs.discover-tests.outputs.test-classes) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Restore and Build
      run: |
        dotnet restore tests/Asynkron.JsEngine.Tests/Asynkron.JsEngine.Tests.csproj
        dotnet build tests/Asynkron.JsEngine.Tests/Asynkron.JsEngine.Tests.csproj --configuration Release --no-restore
        
    - name: Test ${{ matrix.test-class }}
      run: |
        dotnet test tests/Asynkron.JsEngine.Tests/Asynkron.JsEngine.Tests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --filter "FullyQualifiedName~Tests.${{ matrix.test-class }}." \
          --logger "trx;LogFileName=${{ matrix.test-class }}.trx" \
          --results-directory TestResults
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.test-class }}
        path: TestResults/*.trx
        retention-days: 7
        
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: ${{ matrix.test-class }}
        path: 'TestResults/*.trx'
        reporter: dotnet-trx
        fail-on-error: true

  test262:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: core-syntax
            name: CoreSyntax
            filter: >-
              FullyQualifiedName~LanguageTests.ArgumentsObject|
              FullyQualifiedName~LanguageTests.Asi|
              FullyQualifiedName~LanguageTests.BlockScope|
              FullyQualifiedName~LanguageTests.Comments|
              FullyQualifiedName~LanguageTests.ComputedPropertyNames|
              FullyQualifiedName~LanguageTests.Destructuring|
              FullyQualifiedName~LanguageTests.DirectivePrologue|
              FullyQualifiedName~LanguageTests.EvalCode|
              FullyQualifiedName~LanguageTests.Export
          - id: expressions-core
            name: ExpressionsCore
            filter: >-
              FullyQualifiedName=Asynkron.JsEngine.Tests.Test262.LanguageTests.Expressions|
              FullyQualifiedName~LanguageTests.Expressions_addition|
              FullyQualifiedName~LanguageTests.Expressions_array|
              FullyQualifiedName~LanguageTests.Expressions_assignment|
              FullyQualifiedName~LanguageTests.Expressions_assignment_destructuring|
              FullyQualifiedName~LanguageTests.Expressions_assignment_dstr|
              FullyQualifiedName~LanguageTests.Expressions_assignmenttargettype|
              FullyQualifiedName~LanguageTests.Expressions_bitwiseAnd|
              FullyQualifiedName~LanguageTests.Expressions_bitwiseNot|
              FullyQualifiedName~LanguageTests.Expressions_bitwiseOr|
              FullyQualifiedName~LanguageTests.Expressions_bitwiseXor|
              FullyQualifiedName~LanguageTests.Expressions_coalesce|
              FullyQualifiedName~LanguageTests.Expressions_comma|
              FullyQualifiedName~LanguageTests.Expressions_compoundAssignment|
              FullyQualifiedName~LanguageTests.Expressions_concatenation|
              FullyQualifiedName~LanguageTests.Expressions_conditional|
              FullyQualifiedName~LanguageTests.Expressions_delete|
              FullyQualifiedName~LanguageTests.Expressions_division|
              FullyQualifiedName~LanguageTests.Expressions_doesNotEquals|
              FullyQualifiedName~LanguageTests.Expressions_equals|
              FullyQualifiedName~LanguageTests.Expressions_exponentiation|
              FullyQualifiedName~LanguageTests.Expressions_greaterThan|
              FullyQualifiedName~LanguageTests.Expressions_greaterThanOrEqual|
              FullyQualifiedName~LanguageTests.Expressions_grouping|
              FullyQualifiedName~LanguageTests.Expressions_in|
              FullyQualifiedName~LanguageTests.Expressions_instanceof|
              FullyQualifiedName~LanguageTests.Expressions_leftShift|
              FullyQualifiedName~LanguageTests.Expressions_lessThan|
              FullyQualifiedName~LanguageTests.Expressions_lessThanOrEqual|
              FullyQualifiedName~LanguageTests.Expressions_logicalAnd|
              FullyQualifiedName~LanguageTests.Expressions_logicalAssignment|
              FullyQualifiedName~LanguageTests.Expressions_logicalNot|
              FullyQualifiedName~LanguageTests.Expressions_logicalOr|
              FullyQualifiedName~LanguageTests.Expressions_modulus|
              FullyQualifiedName~LanguageTests.Expressions_multiplication|
              FullyQualifiedName~LanguageTests.Expressions_relational|
              FullyQualifiedName~LanguageTests.Expressions_rightShift|
              FullyQualifiedName~LanguageTests.Expressions_strictDoesNotEquals|
              FullyQualifiedName~LanguageTests.Expressions_strictEquals|
              FullyQualifiedName~LanguageTests.Expressions_subtraction|
              FullyQualifiedName~LanguageTests.Expressions_typeof|
              FullyQualifiedName~LanguageTests.Expressions_unaryMinus|
              FullyQualifiedName~LanguageTests.Expressions_unaryPlus|
              FullyQualifiedName~LanguageTests.Expressions_unsignedRightShift|
              FullyQualifiedName~LanguageTests.Expressions_void
          - id: expressions-objects
            name: ExpressionsObjects
            filter: >-
              FullyQualifiedName~LanguageTests.Expressions_call|
              FullyQualifiedName~LanguageTests.Expressions_memberExpression|
              FullyQualifiedName~LanguageTests.Expressions_new|
              FullyQualifiedName~LanguageTests.Expressions_object|
              FullyQualifiedName~LanguageTests.Expressions_object_dstr|
              FullyQualifiedName~LanguageTests.Expressions_object_methodDefinition|
              FullyQualifiedName~LanguageTests.Expressions_object_methodDefinition_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Expressions_object_methodDefinition_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Expressions_optionalChaining|
              FullyQualifiedName~LanguageTests.Expressions_postfixDecrement|
              FullyQualifiedName~LanguageTests.Expressions_postfixIncrement|
              FullyQualifiedName~LanguageTests.Expressions_prefixDecrement|
              FullyQualifiedName~LanguageTests.Expressions_prefixIncrement|
              FullyQualifiedName~LanguageTests.Expressions_propertyAccessors|
              FullyQualifiedName~LanguageTests.Expressions_super|
              FullyQualifiedName~LanguageTests.Expressions_taggedTemplate|
              FullyQualifiedName~LanguageTests.Expressions_templateLiteral|
              FullyQualifiedName~LanguageTests.Expressions_this
          - id: expressions-functions
            name: ExpressionsFunctions
            filter: >-
              FullyQualifiedName~LanguageTests.Expressions_arrowFunction|
              FullyQualifiedName~LanguageTests.Expressions_asyncArrowFunction|
              FullyQualifiedName~LanguageTests.Expressions_asyncFunction|
              FullyQualifiedName~LanguageTests.Expressions_asyncGenerator|
              FullyQualifiedName~LanguageTests.Expressions_await|
              FullyQualifiedName~LanguageTests.Expressions_function|
              FullyQualifiedName~LanguageTests.Expressions_generators|
              FullyQualifiedName~LanguageTests.Expressions_yield
          - id: expressions-classes
            name: ExpressionsClasses
            filter: FullyQualifiedName~LanguageTests.Expressions_class
          - id: expressions-modules
            name: ExpressionsModules
            filter: >-
              FullyQualifiedName~LanguageTests.Expressions_dynamicImport|
              FullyQualifiedName~LanguageTests.Expressions_import_meta|
              FullyQualifiedName~LanguageTests.Expressions_new_target
          - id: functions-identifiers
            name: FunctionsIdentifiers
            filter: >-
              FullyQualifiedName~LanguageTests.FunctionCode|
              FullyQualifiedName~LanguageTests.FutureReservedWords|
              FullyQualifiedName~LanguageTests.GlobalCode|
              FullyQualifiedName~LanguageTests.IdentifierResolution|
              FullyQualifiedName~LanguageTests.Identifiers
          - id: imports-modules
            name: ImportsModules
            filter: >-
              FullyQualifiedName~LanguageTests.Import|
              FullyQualifiedName~LanguageTests.ModuleCode
          - id: statements-class
            name: StatementsClass
            filter: >-
              FullyQualifiedName~LanguageTests.Statements_class|
              FullyQualifiedName~LanguageTests.Statements_class_accessorNameInst|
              FullyQualifiedName~LanguageTests.Statements_class_accessorNameStatic|
              FullyQualifiedName~LanguageTests.Statements_class_arguments|
              FullyQualifiedName~LanguageTests.Statements_class_asyncGenMethod|
              FullyQualifiedName~LanguageTests.Statements_class_asyncGenMethod_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Statements_class_asyncGenMethod_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Statements_class_asyncGenMethodStatic|
              FullyQualifiedName~LanguageTests.Statements_class_asyncGenMethodStatic_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Statements_class_asyncGenMethodStatic_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Statements_class_asyncMethod|
              FullyQualifiedName~LanguageTests.Statements_class_asyncMethod_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Statements_class_asyncMethod_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Statements_class_asyncMethodStatic|
              FullyQualifiedName~LanguageTests.Statements_class_asyncMethodStatic_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Statements_class_asyncMethodStatic_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Statements_class_decorator_syntax_classValid|
              FullyQualifiedName~LanguageTests.Statements_class_decorator_syntax_valid|
              FullyQualifiedName~LanguageTests.Statements_class_definition|
              FullyQualifiedName~LanguageTests.Statements_class_dstr|
              FullyQualifiedName~LanguageTests.Statements_class_elements|
              FullyQualifiedName~LanguageTests.Statements_class_elements_asyncGenPrivateMethod|
              FullyQualifiedName~LanguageTests.Statements_class_elements_asyncGenPrivateMethodStatic|
              FullyQualifiedName~LanguageTests.Statements_class_elements_asyncPrivateMethod|
              FullyQualifiedName~LanguageTests.Statements_class_elements_asyncPrivateMethodStatic|
              FullyQualifiedName~LanguageTests.Statements_class_elements_evaluationError|
              FullyQualifiedName~LanguageTests.Statements_class_elements_genPrivateMethod|
              FullyQualifiedName~LanguageTests.Statements_class_elements_genPrivateMethodStatic|
              FullyQualifiedName~LanguageTests.Statements_class_elements_privateAccessorName|
              FullyQualifiedName~LanguageTests.Statements_class_elements_privateMethods|
              FullyQualifiedName~LanguageTests.Statements_class_elements_syntax_earlyErrors|
              FullyQualifiedName~LanguageTests.Statements_class_elements_syntax_earlyErrors_delete|
              FullyQualifiedName~LanguageTests.Statements_class_elements_syntax_earlyErrors_invalidNames|
              FullyQualifiedName~LanguageTests.Statements_class_elements_syntax_valid|
              FullyQualifiedName~LanguageTests.Statements_class_genMethod|
              FullyQualifiedName~LanguageTests.Statements_class_genMethod_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Statements_class_genMethod_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Statements_class_genMethodStatic|
              FullyQualifiedName~LanguageTests.Statements_class_genMethodStatic_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Statements_class_genMethodStatic_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Statements_class_method|
              FullyQualifiedName~LanguageTests.Statements_class_method_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Statements_class_method_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Statements_class_methodStatic|
              FullyQualifiedName~LanguageTests.Statements_class_methodStatic_forbiddenExt_b1|
              FullyQualifiedName~LanguageTests.Statements_class_methodStatic_forbiddenExt_b2|
              FullyQualifiedName~LanguageTests.Statements_class_nameBinding|
              FullyQualifiedName~LanguageTests.Statements_class_strictMode|
              FullyQualifiedName~LanguageTests.Statements_class_super|
              FullyQualifiedName~LanguageTests.Statements_class_syntax|
              FullyQualifiedName~LanguageTests.Statements_class_syntax_earlyErrors
          - id: statements-subclass
            name: StatementsSubclass
            filter: >-
              FullyQualifiedName~LanguageTests.Statements_class_subclass|
              FullyQualifiedName~LanguageTests.Statements_class_subclassBuiltins
          - id: statements-functions
            name: StatementsFunctions
            filter: >-
              FullyQualifiedName~LanguageTests.Statements_function|
              FullyQualifiedName~LanguageTests.Statements_generators
          - id: statements-async
            name: StatementsAsync
            filter: >-
              FullyQualifiedName~LanguageTests.Statements_asyncFunction|
              FullyQualifiedName~LanguageTests.Statements_asyncGenerator|
              FullyQualifiedName~LanguageTests.Statements_awaitUsing|
              FullyQualifiedName~LanguageTests.Statements_forAwaitOf|
              FullyQualifiedName~LanguageTests.Statements_using
          - id: statements-flow
            name: StatementsFlow
            filter: >-
              FullyQualifiedName~LanguageTests.Statements_block|
              FullyQualifiedName~LanguageTests.Statements_break|
              FullyQualifiedName~LanguageTests.Statements_continue|
              FullyQualifiedName~LanguageTests.Statements_debugger|
              FullyQualifiedName~LanguageTests.Statements_doWhile|
              FullyQualifiedName~LanguageTests.Statements_empty|
              FullyQualifiedName~LanguageTests.Statements_expression|
              FullyQualifiedName~LanguageTests.Statements_for|
              FullyQualifiedName~LanguageTests.Statements_for_dstr|
              FullyQualifiedName~LanguageTests.Statements_forIn|
              FullyQualifiedName~LanguageTests.Statements_forIn_dstr|
              FullyQualifiedName~LanguageTests.Statements_forOf|
              FullyQualifiedName~LanguageTests.Statements_forOf_dstr|
              FullyQualifiedName~LanguageTests.Statements_if|
              FullyQualifiedName~LanguageTests.Statements_labeled|
              FullyQualifiedName~LanguageTests.Statements_return|
              FullyQualifiedName~LanguageTests.Statements_switch|
              FullyQualifiedName~LanguageTests.Statements_switch_syntax_redeclaration|
              FullyQualifiedName~LanguageTests.Statements_throw|
              FullyQualifiedName~LanguageTests.Statements_try|
              FullyQualifiedName~LanguageTests.Statements_try_dstr|
              FullyQualifiedName~LanguageTests.Statements_while|
              FullyQualifiedName~LanguageTests.Statements_with
          - id: statements-bindings
            name: StatementsBindings
            filter: >-
              FullyQualifiedName~LanguageTests.Statements_const|
              FullyQualifiedName~LanguageTests.Statements_const_dstr|
              FullyQualifiedName~LanguageTests.Statements_const_syntax|
              FullyQualifiedName~LanguageTests.Statements_let|
              FullyQualifiedName~LanguageTests.Statements_let_dstr|
              FullyQualifiedName~LanguageTests.Statements_let_syntax|
              FullyQualifiedName~LanguageTests.Statements_variable|
              FullyQualifiedName~LanguageTests.Statements_variable_dstr
          - id: tokens-types
            name: TokensTypes
            filter: >-
              FullyQualifiedName~LanguageTests.Keywords|
              FullyQualifiedName~LanguageTests.LineTerminators|
              FullyQualifiedName~LanguageTests.Literals|
              FullyQualifiedName~LanguageTests.Punctuators|
              FullyQualifiedName~LanguageTests.ReservedWords|
              FullyQualifiedName~LanguageTests.RestParameters|
              FullyQualifiedName~LanguageTests.SourceText|
              FullyQualifiedName~LanguageTests.StatementList|
              FullyQualifiedName~LanguageTests.Types|
              FullyQualifiedName~LanguageTests.WhiteSpace
    name: Test262 (${{ matrix.name }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Restore and Build
      run: |
        dotnet restore tests/Asynkron.JsEngine.Tests.Test262/Asynkron.JsEngine.Tests.Test262.csproj
        dotnet build tests/Asynkron.JsEngine.Tests.Test262/Asynkron.JsEngine.Tests.Test262.csproj --configuration Release --no-restore
        
    - name: Test262 ${{ matrix.name }}
      run: |
        dotnet test tests/Asynkron.JsEngine.Tests.Test262/Asynkron.JsEngine.Tests.Test262.csproj \
          --configuration Release \
          --verbosity normal \
          --settings tests/Asynkron.JsEngine.Tests.Test262/LanguageTests.runsettings \
          --filter "${{ matrix.filter }}" \
          --logger "trx;LogFileName=test262-${{ matrix.id }}.trx" \
          --results-directory TestResults
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test262-results-${{ matrix.id }}
        path: TestResults/*.trx
        retention-days: 7
        
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test262-${{ matrix.name }}
        path: 'TestResults/*.trx'
        reporter: dotnet-trx
        fail-on-error: true

  test-summary:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    
    steps:
    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        pattern: test-results-*
        path: TestResults
        merge-multiple: true
        
    - name: Summary
      run: |
        echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "All test class jobs have completed." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "To retry a specific test class, go to the failed job and click 'Re-run jobs' > 'Re-run failed jobs'" >> $GITHUB_STEP_SUMMARY
