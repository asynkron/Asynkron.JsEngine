<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="959.76pt" height="540pt" viewBox="0 0 959.76 540">
  <rect x="0" y="0" width="959.76" height="540" fill="#0d0d0d"/>
  <text x="54" y="76" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#00b0f0">Execution model</text>
  <text x="56" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e5e7eb">The runtime stopped being a recursive evaluator and became a compiler pipeline.</text>

  <rect x="62" y="184" width="132" height="66" fill="#0b2a3b" stroke="#00b0f0" stroke-width="2"/>
  <text x="85" y="211" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e5e7eb">Source text</text>
  <text x="86" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9ca3af">JavaScript</text>

  <path d="M 194 217 L 250 217" stroke="#d8d8d8" stroke-width="2" fill="none"/>
  <path d="M 250 217 L 239 211 L 239 223 Z" fill="#d8d8d8"/>

  <rect x="252" y="184" width="132" height="66" fill="#2b1855" stroke="#a78bfa" stroke-width="2"/>
  <text x="284" y="211" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e5e7eb">Parser</text>
  <text x="280" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c4b5fd">typed AST</text>

  <path d="M 384 217 L 440 217" stroke="#d8d8d8" stroke-width="2" fill="none"/>
  <path d="M 440 217 L 429 211 L 429 223 Z" fill="#d8d8d8"/>

  <rect x="442" y="184" width="132" height="66" fill="#0b3a31" stroke="#34d399" stroke-width="2"/>
  <text x="474" y="211" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e5e7eb">Lowering</text>
  <text x="467" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#86efac">execution plan</text>

  <path d="M 574 217 L 630 217" stroke="#d8d8d8" stroke-width="2" fill="none"/>
  <path d="M 630 217 L 619 211 L 619 223 Z" fill="#d8d8d8"/>

  <rect x="632" y="184" width="132" height="66" fill="#3a2017" stroke="#ffc000" stroke-width="2"/>
  <text x="670" y="211" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e5e7eb">Bytecode</text>
  <text x="661" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fde68a">expression ops</text>

  <path d="M 764 217 L 820 217" stroke="#d8d8d8" stroke-width="2" fill="none"/>
  <path d="M 820 217 L 809 211 L 809 223 Z" fill="#d8d8d8"/>

  <rect x="822" y="184" width="92" height="66" fill="#4b1530" stroke="#fb7185" stroke-width="2"/>
  <text x="846" y="211" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e5e7eb">Run</text>
  <text x="841" y="233" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#fecdd3">slots/envs</text>

  <rect x="74" y="326" width="226" height="96" fill="#101827" stroke="#334155" stroke-width="1.5"/>
  <text x="96" y="360" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffc000">Why this mattered</text>
  <text x="98" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e5e7eb">Fewer AST objects on hot paths</text>
  <text x="98" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e5e7eb">Explicit runtime seams</text>

  <rect x="356" y="326" width="250" height="96" fill="#101827" stroke="#334155" stroke-width="1.5"/>
  <text x="378" y="360" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffc000">What changed</text>
  <text x="380" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e5e7eb">Statements run as plan instructions</text>
  <text x="380" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e5e7eb">Expressions run as stack bytecode</text>

  <rect x="662" y="326" width="226" height="96" fill="#101827" stroke="#334155" stroke-width="1.5"/>
  <text x="684" y="360" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffc000">The target</text>
  <text x="686" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e5e7eb">AST eval becomes the exception</text>
  <text x="686" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e5e7eb">IR/bytecode owns the fast path</text>
</svg>
