    <line x1="815" y1="372" x2="815" y2="424" stroke="#cbd5e1" stroke-width="1.7"/>
    <polygon points="815,424 809,413 821,413" fill="#cbd5e1"/>

    <path d="M740 358 C690 392 596 402 454 356" fill="none" stroke="#7dd3fc" stroke-width="1.7"/>
    <polygon points="454,356 466,355 462,367" fill="#7dd3fc"/>

    <text x="64" y="510" font-size="12" fill="#d1d5db">Key idea: the big win here was statement IR and slot layout. Expressions still used AST walking.</text>
