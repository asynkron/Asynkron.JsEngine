  <text x="778" y="268" font-family="Menlo, Consolas, monospace" font-size="14" fill="#e5e7eb">fs</text>
  <text x="778" y="296" font-family="Menlo, Consolas, monospace" font-size="14" fill="#e5e7eb">http</text>
  <text x="778" y="324" font-family="Menlo, Consolas, monospace" font-size="14" fill="#e5e7eb">path / timers</text>

  <rect x="150" y="426" width="660" height="56" fill="#101827" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffc000">We did not build a toy Express clone. We built the Node surface area it needed.</text>
