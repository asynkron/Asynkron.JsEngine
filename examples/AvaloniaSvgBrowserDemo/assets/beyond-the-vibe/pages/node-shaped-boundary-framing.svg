<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="959.76pt" height="540pt" viewBox="0 0 959.76 540">
  <rect x="0" y="0" width="959.76" height="540" fill="#0d0d0d"/>
  <g font-family="Arial Rounded MT Bold">
    <text x="74" y="72" font-size="38" fill="#00aff0">Not Node. A Node-shaped boundary.</text>
    <text x="75" y="116" font-size="18" fill="#f3f4f6">The goal was a JavaScript runtime. Node compatibility is a stress test for the host edge.</text>

    <rect x="78" y="172" width="230" height="160" fill="#003846" stroke="#00b0f0" stroke-width="2"/>
    <text x="108" y="214" font-size="21" fill="#f3f4f6">JavaScript code</text>
    <text x="118" y="255" font-size="15" fill="#e5e7eb">require("express")</text>
    <text x="118" y="286" font-size="15" fill="#e5e7eb">app.use(...)</text>
    <text x="118" y="317" font-size="15" fill="#e5e7eb">res.render(...)</text>

    <line x1="308" y1="252" x2="416" y2="252" stroke="#e5e7eb" stroke-width="3"/>
    <polygon points="416,252 402,244 402,260" fill="#e5e7eb"/>

    <rect x="430" y="151" width="220" height="202" fill="#2e185b" stroke="#9b7cff" stroke-width="2"/>
    <text x="476" y="199" font-size="25" fill="#f3f4f6">CommonJS</text>
    <text x="470" y="242" font-size="15" fill="#e5e7eb">local modules</text>
    <text x="470" y="273" font-size="15" fill="#e5e7eb">node_modules</text>
    <text x="470" y="304" font-size="15" fill="#e5e7eb">node: aliases</text>
    <text x="470" y="335" font-size="15" fill="#e5e7eb">package resolution</text>

    <line x1="650" y1="252" x2="758" y2="252" stroke="#e5e7eb" stroke-width="3"/>
    <polygon points="758,252 744,244 744,260" fill="#e5e7eb"/>

    <rect x="772" y="172" width="130" height="160" fill="#004d3c" stroke="#00d084" stroke-width="2"/>
    <text x="806" y="214" font-size="25" fill="#f3f4f6">.NET</text>
    <text x="805" y="255" font-size="15" fill="#e5e7eb">fs / path</text>
    <text x="805" y="286" font-size="15" fill="#e5e7eb">http</text>
    <text x="805" y="315" font-size="14" fill="#e5e7eb">crypto</text>
    <text x="805" y="334" font-size="14" fill="#e5e7eb">timers</text>

    <rect x="104" y="391" width="750" height="68" fill="#101b2d" stroke="#2a4564" stroke-width="2"/>
    <text x="198" y="417" font-size="20" fill="#ffc000">JavaScript stays JavaScript.</text>
    <text x="300" y="445" font-size="20" fill="#f3f4f6">Native work crosses explicit host APIs.</text>
    <text x="281" y="489" font-size="16" fill="#9ca3af">The contract is the interesting part, not pretending this is Node.</text>
  </g>
</svg>
