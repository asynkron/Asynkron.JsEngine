  <text x="532" y="211" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f3f4f6">Find repeated implementation shapes</text>

  <rect x="508" y="256" width="312" height="58" fill="#3a2017" stroke="#ffc000" stroke-width="2"/>
  <text x="532" y="291" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f3f4f6">Ask: common abstraction or coincidence?</text>

  <rect x="508" y="336" width="312" height="58" fill="#4b1530" stroke="#fb7185" stroke-width="2"/>
  <text x="532" y="371" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#f3f4f6">Refactor only when it reduces risk</text>

  <text x="146" y="462" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#e5e7eb">Mechanical smell detector first. Human judgment second.</text>
