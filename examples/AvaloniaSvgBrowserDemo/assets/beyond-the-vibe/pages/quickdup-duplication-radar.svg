  <text x="246" y="222" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#00b0f0">Presenting Asynkron.QuickDup</text>
  <text x="246" y="262" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#f8fafc">AI-era code clone detector.</text>
