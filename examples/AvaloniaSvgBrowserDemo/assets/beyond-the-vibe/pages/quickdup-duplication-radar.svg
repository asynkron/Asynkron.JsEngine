  <text x="46" y="252" font-family="Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">src/Asynkron.JsEngine/StdLib/.../TypedArrayPrototype.cs:377</text>
  <text x="18" y="286" font-family="Menlo, Consolas, monospace" font-size="12" fill="#34d399">Fingerprint: indent delta + first token + token similarity</text>
