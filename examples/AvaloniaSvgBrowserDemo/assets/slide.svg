<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect id="background" x="0" y="0" width="1280" height="720" fill="#05070d"/>
  <circle id="pulse" cx="1060" cy="180" r="74" fill="#00b0f0" opacity="0.25"/>
  <rect id="card" x="92" y="110" width="1096" height="500" rx="18" fill="#0b1220" stroke="#00b0f0" stroke-width="3" opacity="0.92"/>
  <text id="eyebrow" x="120" y="170" fill="#ffc000" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="28">AVALONIA SVG BROWSER DEMO</text>
  <text id="headline" x="120" y="276" fill="#00b0f0" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="72">JsEngine drives the slide</text>
  <text id="subtitle" x="124" y="342" fill="#dbeafe" font-family="Arial, sans-serif" font-size="30">A tiny custom SVG API, not a full browser DOM.</text>
  <g id="runtime" transform="translate(120 430)">
    <rect x="0" y="0" width="260" height="92" rx="12" fill="#111827" stroke="#34d399" stroke-width="2"/>
    <text x="24" y="38" fill="#34d399" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="25">JsEngine</text>
    <text x="24" y="68" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="18">frontend script host</text>
  </g>
  <path id="beam" d="M420 475 C575 385, 690 385, 850 475" fill="none" stroke="#ffc000" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <g id="svgmodel" transform="translate(888 430)">
    <rect x="0" y="0" width="260" height="92" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
    <text x="24" y="38" fill="#a78bfa" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="25">SVG model</text>
    <text x="24" y="68" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="18">host-backed mutations</text>
  </g>
</svg>
