<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #05070d;
        }

        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .panel {
            position: absolute;
            left: 22.8%;
            top: 38.1%;
            width: 54.5%;
            min-height: 44.4%;
            box-sizing: border-box;
            padding: 28px 34px 30px;
            background: rgba(0, 0, 0, 0.34);
            color: #fff;
            font-family: "Inter", "SF Pro Display", Arial, sans-serif;
            pointer-events: none;
        }

        .panel h1 {
            margin: 0 0 20px;
            color: #00aff0;
            font-size: clamp(28px, 4.2vw, 54px);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: 0;
        }

        .panel p {
            margin: 0 0 11px;
            font-size: clamp(18px, 2.5vw, 32px);
            line-height: 1.08;
            font-weight: 700;
            letter-spacing: 0;
        }

        .panel p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <video src="testrunner.mov" autoplay muted loop playsinline></video>
    <section class="panel" aria-label="Asynkron.TestRunner details">
        <h1>Asynkron.TestRunner</h1>
        <p>Process isolation.</p>
        <p>Multi Process.</p>
        <p>Work pulling pattern.</p>
        <p>Blame detector.</p>
        <p>Still same old Xunit / Nunit tests</p>
    </section>
</body>
</html>
