<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JsEngine Issue Tracker</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main>
      <section class="toolbar">
        <div>
          <h1>JsEngine Issue Tracker</h1>
          <p id="status">Loading runtime status...</p>
        </div>
        <div class="filters">
          <button data-filter="">All</button>
          <button data-filter="open">Open</button>
          <button data-filter="closed">Closed</button>
        </div>
      </section>

      <section class="new-issue">
        <input id="title" placeholder="Issue title">
        <input id="owner" placeholder="Owner">
        <select id="priority">
          <option>high</option>
          <option selected>medium</option>
          <option>low</option>
        </select>
        <button id="create">Create</button>
      </section>

      <section id="issues" class="issues"></section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
